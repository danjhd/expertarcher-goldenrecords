# ExpertArcher -> Golden Records name mappings.
#
# One flat mapping of "ExpertArcher name": "Golden Records name". Rounds, bow
# types, age classes and classifications all live here together -- they are all
# just name translations.
#
# The comment groups below are for readability only; the parser sees one
# mapping. Keys and values are always quoted so a name that looks like a number
# or a boolean ("1440", "No") stays a string.

# --- Bow types ---
"afb": "American Flatbow"

# --- Rounds ---
"252 10yds": "252 - 10 yds"
"252 20yds": "252 - 20 yds"
